name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No lockfile is committed, so install (not ci). Type-stripping needs
      # Node >= 22.18 — "22" resolves to the latest 22.x.
      - run: npm install

      - run: npm run typecheck

      - run: npm test
