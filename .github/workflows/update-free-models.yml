name: Update free-models.json

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual trigger
  push:
    paths:
      - "scripts/build-free-models.mjs"  # re-run when the script changes

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Fetch overrides from data branch
        run: |
          # Try to get overrides.yml from the data branch. Reads it straight
          # from the fetched ref — this step never leaves the current branch.
          if git fetch origin data:data 2>/dev/null; then
            git show data:overrides.yml > "$RUNNER_TEMP/overrides.yml" 2>/dev/null || true
            echo "✅ Loaded overrides from data branch"
          else
            echo "ℹ️  No data branch yet — skipping overrides"
          fi

      - name: Build free-models.json
        run: |
          OVERRIDES_FLAG=""
          if [ -f "$RUNNER_TEMP/overrides.yml" ]; then
            OVERRIDES_FLAG="--overrides $RUNNER_TEMP/overrides.yml"
          fi
          node scripts/build-free-models.mjs --out "$RUNNER_TEMP" --pretty $OVERRIDES_FLAG

      - name: Commit to data branch
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch the data branch if it exists, otherwise create an orphan.
          if git fetch origin data:data; then
            git checkout data
          else
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
          fi

          # Replace contents with just the new JSON
          cp "$RUNNER_TEMP/free-models.json" .
          git add free-models.json

          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
            exit 0
          fi

          git commit -m "chore: update free-models.json [skip ci]

          Generated from opencode.ai/docs/zen + models.dev
          Triggered by: ${{ github.event_name }}
          Commit: ${{ github.sha }}"

          git push origin data
          echo "✅ Pushed free-models.json to data branch"
          # Signal the purge step below; skipped when nothing was pushed.
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsdelivr CDN cache
        # Only needed when the file actually changed — unchanged content means
        # the CDN is already serving exactly what we would publish.
        if: steps.commit.outputs.pushed == 'true'
        run: |
          # The extension fetches free-models.json through jsdelivr, whose edge
          # keeps serving the previous file until purged (observed for hours).
          # Without this, users stay on a stale model list after every refresh.
          PURGE_URL="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/free-models.json"
          if ! BODY=$(curl -sS --fail --retry 3 --retry-delay 5 "$PURGE_URL"); then
            echo "❌ jsdelivr purge request failed — the CDN will keep serving the stale list until its cache expires."
            exit 1
          fi
          echo "$BODY"
          if echo "$BODY" | grep -q '"throttled":[[:space:]]*true'; then
            echo "⚠️  jsdelivr throttled this purge — some edges may keep the old file until their TTL expires."
          else
            echo "✅ jsdelivr CDN purged — edges re-fetch the updated free-models.json on next request"
          fi
