name: Update free-models.json

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual trigger
  push:
    paths:
      - "scripts/build-free-models.mjs"  # re-run when the script changes

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build free-models.json
        run: node scripts/build-free-models.mjs --out "$RUNNER_TEMP" --pretty

      - name: Commit to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch or create the data branch
          git fetch origin data:data 2>/dev/null || git branch data --orphan

          # Switch to data branch with only the JSON file
          git checkout data

          # Remove old files (in case the branch had them)
          git rm -rf . 2>/dev/null || true

          # Copy the new JSON
          cp "$RUNNER_TEMP/free-models.json" .

          # Only commit if something changed
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes — skipping commit"
            exit 0
          fi

          git add free-models.json
          git commit -m "chore: update free-models.json [skip ci]

          Generated from opencode.ai/docs/zen + models.dev
          Triggered by: ${{ github.event_name }}
          Commit: ${{ github.sha }}"

          git push origin data
          echo "✅ Pushed free-models.json to data branch"
